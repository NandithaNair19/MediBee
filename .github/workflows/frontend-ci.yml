name: MediBee Frontend CI

on:
  push:
    branches:
      - main

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
    
  smoke-test:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to deploy
        run: sleep 30

      - name: Smoke test frontend (live)
        run: |
          curl --fail https://medi-bee.vercel.app
          echo "✅ Frontend is alive"

      - name: Smoke test backend (live)
        run: |
          curl --fail https://medibee-uqg6.onrender.com
          echo "✅ Backend is alive"